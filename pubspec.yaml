name: id_document_scanner
description: >-
  Paraguayan ID card scanner: guided camera overlay, exact card crop, offline
  MRZ OCR and screen/print detection. Pure Dart, no ML Kit.
version: 1.0.1
repository: https://github.com/jcazalELPAKOMICHI/id_document_scanner
issue_tracker: https://github.com/jcazalELPAKOMICHI/id_document_scanner/issues
topics:
  - camera
  - document-scanner
  - ocr
  - mrz
  - kyc

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

platforms:
  android:
  ios:

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
